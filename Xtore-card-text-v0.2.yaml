    /* Target the container of the rows */

    #states > * {
      margin-top: -5px;
      margin-bottom: -5px;
    }

    /* Optional: reduce padding of the whole card content to make it even
    tighter */

    .card-content {
      padding-top: 10px;
      padding-bottom: 10px;
    }
