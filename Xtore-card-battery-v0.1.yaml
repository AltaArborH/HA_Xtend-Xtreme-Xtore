type: custom:stack-in-card
title: Xtore status
card_mod:
  style: |
    ha-card {
      background-color: var(--card-background-color) !important;
      border-radius: 12px;
    }
cards:
  - type: horizontal-stack
    cards:
      - type: picture-elements
        image: >-
          data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'
          viewBox='0 0 100 100'%3E%3C/svg%3E
        card_mod:
          style: |
            ha-card {
              --ha-card-border-width: 0px !important;
              background: transparent !important;
              box-shadow: none !important;
              height: 250px;
            }
        elements:
          - type: custom:andy-sensor-card
            entity: sensor.xtend_dhw_availability_xtore
            name: " "
            symbol: battery_liquid
            orientation: vertical
            glass: true
            industrial_look: true
            show_scale: true
            scale_color_mode: per_interval
            value_position: none
            intervals:
              - id: it0
                to: 10
                color: "#ef4444"
              - id: it1
                to: 20
                color: "#f97316"
              - id: it2
                to: 30
                color: "#f59e0b"
              - id: it3
                to: 40
                color: "#fbbf24"
              - id: it4
                to: 50
                color: "#eab308"
              - id: it5
                to: 60
                color: "#a3e635"
              - id: it6
                to: 70
                color: "#84cc16"
              - id: it7
                to: 80
                color: "#4ade80"
              - id: it8
                to: 90
                color: "#22c55e"
              - id: it9
                to: 100
                color: "#16a34a"
            style:
              top: 50%
              left: 50%
              width: 100%
              transform: translate(-50%, -50%)
              "--ha-card-border-width": 0px;
          - type: state-label
            entity: sensor.xtend_dhw_availability_xtore
            suffix: ""
            style:
              top: 50%
              left: 51%
              font-size: 1.8rem
              font-weight: bold
              color: white
              text-shadow: 1px 1px 3px rgba(0,0,0,0.8)
              pointer-events: none
      - type: vertical-stack
        cards:
          - type: custom:mushroom-template-card
            primary: Xtore Status
            secondary: "{{ states(\"sensor.xtend_dhw_status_xtore\") }}"
            icon: mdi:water-boiler
            icon_color: green
            card_mod:
              style: |
                ha-card {
                  --ha-card-border-width: 0px !important;
                  background: transparent !important;
                  box-shadow: none !important;
                }
          - type: custom:mushroom-template-card
            primary: Availability
            secondary: "{{ states(\"sensor.xtend_dhw_availability_xtore\") }}%"
            icon: mdi:water-percent
            icon_color: green
            card_mod:
              style: |
                ha-card {
                  --ha-card-border-width: 0px !important;
                  background: transparent !important;
                  box-shadow: none !important;
                }
          - type: custom:mushroom-template-card
            primary: Temperature
            secondary: "{{ states(\"sensor.xtend_dhw_actual_temperature_xtore\") }}°C"
            icon: mdi:thermometer
            icon_color: green
            card_mod:
              style: |
                ha-card {
                  --ha-card-border-width: 0px !important;
                  background: transparent !important;
                  box-shadow: none !important;
                }
          - type: custom:mushroom-template-card
            primary: Volume
            secondary: "{{ states(\"sensor.xtend_dhw_tank_volume_xtore\") }} L"
            icon: mdi:barrel
            icon_color: green
            card_mod:
              style: |
                ha-card {
                  --ha-card-border-width: 0px !important;
                  background: transparent !important;
                  box-shadow: none !important;
                }

