# ══════════════════════════════════════════════════════════════
# DOMESTIC HOT WATER  (Xtore)
# ══════════════════════════════════════════════════════════════

- sensor:
    - name: "Xtore current temperature"
      unique_id: xtend_610b_dhw_actual_temp
      state: "{{ (state_attr('sensor.Intergas_Xtend', 'stats')['610b'] | float * 0.01) | round(2) }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      icon: mdi:water-thermometer

    - name: "Xtore target temperature"
      unique_id: xtend_61eb_dhw_setpoint
      state: "{{ (state_attr('sensor.Intergas_Xtend', 'stats')['61eb'] | float * 0.01) | round(2) }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      icon: mdi:water-thermometer-outline
      
    - name: "Xtore tank volume"
      unique_id: xtend_61ba_dhw_volume
      state: "{{ state_attr('sensor.Intergas_Xtend', 'stats')['61ba'] | int }}"
      unit_of_measurement: "L"
      state_class: measurement
      icon: mdi:water-boiler

    - name: "Xtore availability"
      unique_id: xtend_dhw_availability_calc
      state: >
        {% set actual = state_attr('sensor.Intergas_Xtend', 'stats')['610b'] | float * 0.01 %}
        {% set setpoint = state_attr('sensor.Intergas_Xtend', 'stats')['61eb'] | float * 0.01 %}
        {% set cold = 19.4 %}
        {% if (setpoint - cold) > 0 %}
          {{ ((actual - cold) / (setpoint - cold) * 100) | round(0) | int }}
        {% else %}
          0
        {% endif %}
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:water-percent

    - name: "Xtore Status"
      unique_id: xtend_6117_dhw_status
      state: >
        {% set v = state_attr('sensor.Intergas_Xtend', 'stats')['6117'] | int %}
        {% if v == 0 %}Standby
        {% elif v == 1 %}Heating1
        {% elif v == 3 %}Heating
        {% elif v == 7 %}Running low_to-check
        {% elif v == 9 %}Legionella-run_to-check
        {% else %}Unknown ({{ v }}){% endif %}
      icon: mdi:water-boiler-auto

    - name: xtend_heatdemand_status
      unique_id: xtend_heatdemand_status_7e51
      state: >
        {% set value = state_attr('sensor.Intergas_Xtend', 'stats')['7e51'] %}
        {% if value == 0 %}
          opentherm
        {% elif value == 15 %}
          boiler_ext
        {% elif value == 37 %}
          ch_rf
        {% elif value == 126 %}
          standby
        {% elif value == 85 %}
          sensortest
        {% elif value == 86 %}
          commissioning
        {% elif value == 87 %}
          crankheating
        {% elif value == 170 %}
          service
        {% elif value == 204 %}
          dhw
        {% elif value == 51 %}
          dhw_int
        {% elif value == 240 %}
          boiler_int
        {% elif value == 153 %}
          postrun_boiler
        {% elif value == 102 %}
          ch
        {% elif value == 103 %}
          ch_wait
        {% elif value == 104 %}
          defrosting
        {% elif value == 255 %}
          heatup
        {% elif value == 24 %}
          frost
        {% elif value == 230 %}
          starting_ch
        {% elif value == 231 %}
          postrun_ch
        {% elif value == 127 %}
          off
        {% elif value == 205 %}
          dhw_hreco
        {% elif value == 206 %} #code 206 is not in the manual, but seems to be related to legionella runs, as it appears when a legionella run is active
          Legionella-run
        {% elif value == 207 %} #code 207 is not in the manual, but seems to be related to legionella runs, and shows "waiting for boiler heating" in the web-interface around the legionella run.
          waiting_for_xtore_heating
        {% elif value == 117 %}
          starting_cooling
        {% elif value == 118 %}
          cooling
        {% elif value == 119 %}
          cooling_wait
        {% elif value == 189 %}
          postrun_cooling
        {% else %}
          {{ value }}  #value is projected instead of a name, for unknown values
        {% endif %}
      icon: mdi:message-badge-outline
